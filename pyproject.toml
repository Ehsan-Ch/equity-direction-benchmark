[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-direction-benchmark"
version = "0.1.0"
description = "Reproducible walk-forward probability benchmarks on real US equity factor data"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "pandas==2.2.3", "scikit-learn==1.8.0", "matplotlib==3.10.8", "joblib==1.5.3"]

[project.scripts]
equity-benchmark = "equity_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
